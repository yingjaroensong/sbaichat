name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
concurrency:
  group: build-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: 27.254.86.109
      FTP_USER: sumshopp
      FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      KS_PASS: ${{ secrets.FTP_PASSWORD }}
      BUILD_NO: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.24.5', cache: true }
      - name: Generate Android project
        run: flutter create --platforms=android --org com.sbai --project-name sbaichat .

      - name: Permanent signing key (kept on host, outside public_html)
        run: |
          if [ -z "$FTP_PASS" ]; then echo "::error::Missing secret FTP_PASSWORD"; exit 1; fi
          KS=android/app/release.jks
          LIST=$(curl -sS --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/sbaichat_private/" -l || true)
          if echo "$LIST" | grep -qx 'release.jks'; then
            curl -fsS --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/sbaichat_private/release.jks" -o "$KS"
            echo "Using existing key"
          else
            keytool -genkeypair -keystore "$KS" -alias sbaichat -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=SBAI Chat, O=SBAI, C=TH"
            curl -fsS --ftp-create-dirs --user "$FTP_USER:$FTP_PASS" -T "$KS" "ftp://$FTP_HOST/sbaichat_private/release.jks"
            echo "Created and stored new key"
          fi
          keytool -list -keystore "$KS" -storepass "$KS_PASS" > /dev/null
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=sbaichat\n' "$KS_PASS" "$KS_PASS" > android/key.properties

      - name: Patch Android project
        run: python3 tool/patch_android.py
      - run: flutter pub get
      - name: Build
        run: |
          flutter build apk --release --split-per-abi \
            --build-number=$BUILD_NO --build-name=1.0.$BUILD_NO --dart-define=BUILD_NUMBER=$BUILD_NO
          ls -la build/app/outputs/flutter-apk/

      - name: Deploy to sbaichat.com/download
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          OUT=build/app/outputs/flutter-apk
          D="ftp://$FTP_HOST/domains/sbaichat.com/public_html/download"
          curl -fsS --user "$FTP_USER:$FTP_PASS" -T "$OUT/app-arm64-v8a-release.apk" "$D/sbaichat.apk"
          curl -fsS --user "$FTP_USER:$FTP_PASS" -T "$OUT/app-armeabi-v7a-release.apk" "$D/sbaichat-armv7.apk"
          python3 - <<'EOF'
          import json, os
          n = int(os.environ['BUILD_NO'])
          notes = (os.environ.get('NOTES') or '').strip().splitlines()
          json.dump({'version_code': n, 'version_name': f'v1.0.{n}', 'notes': notes[0][:200] if notes else '',
                     'apk_arm64': 'https://sbaichat.com/download/sbaichat.apk',
                     'apk_armv7': 'https://sbaichat.com/download/sbaichat-armv7.apk'},
                    open('version.json', 'w'), ensure_ascii=False)
          EOF
          cat version.json
          curl -fsS --user "$FTP_USER:$FTP_PASS" -T version.json "$D/version.json"

      - uses: actions/upload-artifact@v4
        with:
          name: sbaichat-apk
          path: build/app/outputs/flutter-apk/*.apk
