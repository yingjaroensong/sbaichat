name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
concurrency:
  group: build-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY: https://sbaichat.com/api/deploy.php
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      KS_PASS: ${{ secrets.FTP_PASSWORD }}
      BUILD_NO: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.24.5', cache: true }
      - name: Generate Android project
        run: flutter create --platforms=android --org com.sbai --project-name sbaichat .

      - name: Signing key (from GitHub secret)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ]; then echo "::error::Missing secrets KEYSTORE_B64 / FTP_PASSWORD"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          keytool -list -keystore android/app/release.jks -storepass "$KS_PASS" > /dev/null
          { echo 'storeFile=release.jks'; echo "storePassword=$KS_PASS"; echo "keyPassword=$KS_PASS"; echo 'keyAlias=sbaichat'; } > android/key.properties
          echo "key ok"

      - name: Patch Android project
        run: python3 tool/patch_android.py
      - run: flutter pub get
      - name: Build
        run: |
          flutter build apk --release --split-per-abi \
            --build-number=$BUILD_NO --build-name=1.0.$BUILD_NO --dart-define=BUILD_NUMBER=$BUILD_NO
          ls -la build/app/outputs/flutter-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: sbaichat-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          compression-level: 0

      - name: Deploy to sbaichat.com/download
        continue-on-error: true
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          set -e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          call() {  # retry a request until it returns JSON {"ok":true}
            for t in 1 2 3 4 5 6; do
              R=$(curl -sS -A "$UA" -H "X-Deploy-Key: $DEPLOY_KEY" "$@" || true)
              if echo "$R" | grep -q '"ok":true'; then echo "$R"; return 0; fi
              echo "retry $t: $(echo "$R" | head -c 120)" >&2
              sleep $((t*10))
            done
            echo "::error::host rejected request (bot protection?)"; return 1
          }
          up() {  # $1=local file  $2=remote name
            rm -rf chunks && mkdir chunks
            split -b 4m -d -a 4 "$1" chunks/c
            first=1
            for c in chunks/c*; do
              ap=1; [ $first = 1 ] && ap=0; first=0
              call --data-binary @"$c" "$DEPLOY?action=put&name=$2&append=$ap" > /dev/null
            done
            SUM=$(sha256sum "$1" | cut -d' ' -f1)
            call -X POST "$DEPLOY?action=commit&name=$2&sha256=$SUM"
          }
          OUT=build/app/outputs/flutter-apk
          up "$OUT/app-arm64-v8a-release.apk" sbaichat.apk
          up "$OUT/app-armeabi-v7a-release.apk" sbaichat-armv7.apk
          python3 - <<'EOF'
          import json, os
          n = int(os.environ['BUILD_NO'])
          notes = (os.environ.get('NOTES') or '').strip().splitlines()
          json.dump({'version_code': n, 'version_name': f'v1.0.{n}', 'notes': notes[0][:200] if notes else '',
                     'apk_arm64': 'https://sbaichat.com/download/sbaichat.apk',
                     'apk_armv7': 'https://sbaichat.com/download/sbaichat-armv7.apk'},
                    open('version.json', 'w'), ensure_ascii=False)
          EOF
          cat version.json
          up version.json version.json

