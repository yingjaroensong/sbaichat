name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
concurrency:
  group: build-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY: https://sbaichat.com/api/deploy.php
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      KS_PASS: ${{ secrets.FTP_PASSWORD }}
      BUILD_NO: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.24.5', cache: true }
      - name: Generate Android project
        run: flutter create --platforms=android --org com.sbai --project-name sbaichat .

      - name: Permanent signing key (stored on host, outside public_html)
        run: |
          if [ -z "$DEPLOY_KEY" ] || [ -z "$KS_PASS" ]; then echo "::error::Missing secrets DEPLOY_KEY / FTP_PASSWORD"; exit 1; fi
          curl -fsS -H "X-Deploy-Key: $DEPLOY_KEY" "$DEPLOY?action=info"; echo
          KS=android/app/release.jks
          CODE=$(curl -sS -o "$KS" -w '%{http_code}' -H "X-Deploy-Key: $DEPLOY_KEY" "$DEPLOY?action=get_key")
          if [ "$CODE" = "200" ]; then
            echo "Using existing key"
          else
            rm -f "$KS"
            keytool -genkeypair -keystore "$KS" -alias sbaichat -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=SBAI Chat, O=SBAI, C=TH"
            curl -fsS -H "X-Deploy-Key: $DEPLOY_KEY" --data-binary @"$KS" "$DEPLOY?action=put_key"; echo
            echo "Created and stored new key"
          fi
          keytool -list -keystore "$KS" -storepass "$KS_PASS" > /dev/null
          printf 'storeFile=release.jks\nstorePassword=[REDACTED_PASSWORD]=%s\nkeyAlias=sbaichat\n' "$KS_PASS" "$KS_PASS" > android/key.properties

      - name: Patch Android project
        run: python3 tool/patch_android.py
      - run: flutter pub get
      - name: Build
        run: |
          flutter build apk --release --split-per-abi \
            --build-number=$BUILD_NO --build-name=1.0.$BUILD_NO --dart-define=BUILD_NUMBER=$BUILD_NO
          ls -la build/app/outputs/flutter-apk/

      - name: Deploy to sbaichat.com/download
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          set -e
          up() {  # $1=local file  $2=remote name
            rm -rf chunks && mkdir chunks
            split -b 4m -d -a 4 "$1" chunks/c
            first=1
            for c in chunks/c*; do
              ap=1; [ $first = 1 ] && ap=0; first=0
              curl -fsS --retry 3 -H "X-Deploy-Key: $DEPLOY_KEY" --data-binary @"$c" \
                "$DEPLOY?action=put&name=$2&append=$ap" > /dev/null
            done
            SUM=$(sha256sum "$1" | cut -d' ' -f1)
            curl -fsS -H "X-Deploy-Key: $DEPLOY_KEY" -X POST "$DEPLOY?action=commit&name=$2&sha256=$SUM"; echo
          }
          OUT=build/app/outputs/flutter-apk
          up "$OUT/app-arm64-v8a-release.apk" sbaichat.apk
          up "$OUT/app-armeabi-v7a-release.apk" sbaichat-armv7.apk
          python3 - <<'EOF'
          import json, os
          n = int(os.environ['BUILD_NO'])
          notes = (os.environ.get('NOTES') or '').strip().splitlines()
          json.dump({'version_code': n, 'version_name': f'v1.0.{n}', 'notes': notes[0][:200] if notes else '',
                     'apk_arm64': 'https://sbaichat.com/download/sbaichat.apk',
                     'apk_armv7': 'https://sbaichat.com/download/sbaichat-armv7.apk'},
                    open('version.json', 'w'), ensure_ascii=False)
          EOF
          cat version.json
          up version.json version.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbaichat-apk
          path: build/app/outputs/flutter-apk/*.apk
