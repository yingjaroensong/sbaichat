name: sbaichat
description: SBAI Chat - LINE-like chat app
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  flutter_webrtc: ^0.11.7
  flutter_background_service: ^5.0.10
  flutter_local_notifications: ^17.2.4
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  file_picker: ^8.1.2
  record: 5.1.2
  audioplayers: ^6.1.0
dependency_overrides:
  record_platform_interface: 1.1.0
  record_android: 1.2.6
  record_linux: 0.7.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
